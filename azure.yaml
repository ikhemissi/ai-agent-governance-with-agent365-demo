# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: ai-agent-governance-with-agent365-demo

# One Terraform root per layer (infra/<layer>/), provisioned in this order; layers pass values through the azd
# environment. Add the spike's own layers after these.
infra:
  provider: terraform
  layers:
    - name: azure-platform
      path: infra/azure-platform
    - name: foundry-model
      path: infra/foundry-model
      dependsOn: [azure-platform]
      hooks:
        preprovision:
          posix:
            shell: sh
            run: bash ./hooks/preprovision.sh
    - name: postgres
      path: infra/postgres
      dependsOn: [azure-platform]
    - name: litellm-gateway
      path: infra/litellm-gateway
      dependsOn: [azure-platform, foundry-model, postgres]
      hooks:
        postprovision:
          posix:
            shell: sh
            run: bash ./hooks/postprovision.sh
    - name: apim-gateway
      path: infra/apim-gateway
      dependsOn: [azure-platform, foundry-model]
    # With API Management, only the gateway's identity can call it (external ingress); with LiteLLM, internal ingress.
    - name: notes-mcp
      path: infra/notes-mcp
      dependsOn: [azure-platform, apim-gateway]
    # The demo's own layer: the notes MCP server registered in API Management (azapi); outputs CHAT_UI_MCP_SERVERS.
    - name: apim-mcp
      path: infra/apim-mcp
      dependsOn: [apim-gateway, notes-mcp]
    # The demo's Purview check at the gateway: off until the named value purview-check is "on" (docs/PURVIEW.md).
    - name: apim-purview
      path: infra/apim-purview
      dependsOn: [apim-gateway]
    # Calls API Management with the user's own token and runs the tool loop itself (CHAT_UI_MCP_SERVERS).
    - name: chat-ui
      path: infra/chat-ui
      dependsOn: [azure-platform, foundry-model, apim-gateway]

services:
  notes-mcp:
    project: ./services/notes-mcp
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      # Images are built in the platform's registry: no local Docker needed to deploy.
      remoteBuild: true
    hooks:
      postdeploy:
        posix:
          shell: sh
          run: bash ../../infra/notes-mcp/hooks/postdeploy.sh
  chat-ui:
    project: ./services/chat-ui
    language: ts
    host: containerapp
    docker:
      path: ./Dockerfile
      # Images are built in the platform's registry: no local Docker needed to deploy.
      remoteBuild: true
    hooks:
      postdeploy:
        posix:
          shell: sh
          run: bash ../../infra/chat-ui/hooks/postdeploy.sh

hooks:
  preprovision:
    posix:
      shell: sh
      run: bash ./infra/azure-platform/hooks/preprovision.sh
      interactive: false
      continueOnError: false
  predown:
    posix:
      shell: sh
      run: bash ./infra/azure-platform/hooks/predown.sh
      interactive: false
      continueOnError: false
