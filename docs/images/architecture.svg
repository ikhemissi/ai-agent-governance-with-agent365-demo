<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">AI agent governance with Agent 365 and AI gateways</title>
  <desc id="desc">A chat agent reaches its model and its MCP tools only through Azure API Management, with the user's token. Agent 365 governs API Management and a second gateway, LiteLLM, from the side: it discovers their MCP servers, blocks a server or a single tool, and every action leaves evidence. Optionally, API Management checks what goes to the model and what comes back with Microsoft Purview, as the user.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#424242"/>
    </marker>
    <marker id="arrow-dlp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0B7A75"/>
    </marker>
    <marker id="arrow-gov" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7B4FB8"/>
    </marker>
  </defs>

  <!-- Background, so that the diagram reads the same on light and dark pages -->
  <rect x="0" y="0" width="1000" height="610" rx="16" fill="#FFFFFF"/>

  <!-- Headline -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#1B1B1B">Agent 365 governs. Your AI gateway enforces.</text>
  <text x="40" y="70" font-size="14" fill="#555555">The agent's calls go through the gateway; Agent 365 discovers and blocks from the side, outside the call path.</text>

  <g transform="translate(0 70)">
  <!-- Optional: Purview at the gateway -->
  <rect x="430" y="22" width="180" height="48" rx="10" fill="#E6F4F3" stroke="#0B7A75" stroke-width="2"/>
  <text x="520" y="43" font-size="14" font-weight="700" text-anchor="middle" fill="#0B5552">Microsoft Purview</text>
  <text x="520" y="60" font-size="11" text-anchor="middle" fill="#0B5552">DLP policy</text>
  <line x1="520" y1="103" x2="520" y2="72" stroke="#0B7A75" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-dlp)"/>
  <text x="530" y="91" font-size="11" fill="#0B7A75">optional: prompts and answers, as the user</text>
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="430" cy="22" r="12" fill="#1B1B1B"/><text x="430" y="26">6</text>
  </g>

  <!-- Row 1: the agent's path -->
  <circle cx="60" cy="146" r="11" fill="#424242"/>
  <path d="M42 182 a18 16 0 0 1 36 0 z" fill="#424242"/>
  <text x="60" y="202" font-size="12" text-anchor="middle" fill="#424242">User</text>

  <rect x="110" y="125" width="170" height="70" rx="10" fill="#F5F5F5" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="195" y="155" font-size="16" font-weight="600" text-anchor="middle" fill="#1B1B1B">Chat agent</text>
  <text x="195" y="176" font-size="12" text-anchor="middle" fill="#555555">runs the tool loop</text>

  <line x1="280" y1="160" x2="398" y2="160" stroke="#424242" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="339" y="150" font-size="12" text-anchor="middle" fill="#424242">user's token</text>

  <rect x="400" y="105" width="240" height="110" rx="12" fill="#E6F1FB" stroke="#0078D4" stroke-width="2"/>
  <text x="520" y="140" font-size="17" font-weight="700" text-anchor="middle" fill="#0F4A85">Azure API Management</text>
  <text x="520" y="162" font-size="13" text-anchor="middle" fill="#0F4A85">the agent's AI gateway</text>
  <text x="520" y="183" font-size="12" text-anchor="middle" fill="#555555">checks every call · logs every request</text>

  <line x1="640" y1="129" x2="738" y2="129" stroke="#424242" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="191" x2="738" y2="191" stroke="#424242" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="689" y="164" font-size="11" text-anchor="middle" fill="#555555">managed</text>
  <text x="689" y="177" font-size="11" text-anchor="middle" fill="#555555">identity</text>

  <rect x="740" y="105" width="220" height="48" rx="10" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="850" y="134" font-size="14" font-weight="600" text-anchor="middle" fill="#1B1B1B">Foundry model</text>
  <rect x="740" y="167" width="220" height="48" rx="10" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="850" y="188" font-size="14" font-weight="600" text-anchor="middle" fill="#1B1B1B">Notes MCP server</text>
  <text x="850" y="205" font-size="11" text-anchor="middle" fill="#555555">"Team notes (APIM)"</text>

  <!-- Row 2: governance -->
  <circle cx="60" cy="281" r="11" fill="#7B4FB8"/>
  <path d="M42 317 a18 16 0 0 1 36 0 z" fill="#7B4FB8"/>
  <text x="60" y="337" font-size="12" text-anchor="middle" fill="#7B4FB8">Admin</text>

  <rect x="110" y="255" width="170" height="80" rx="10" fill="#F1EAFA" stroke="#7B4FB8" stroke-width="2"/>
  <text x="195" y="284" font-size="17" font-weight="700" text-anchor="middle" fill="#4B2A7B">Agent 365</text>
  <text x="195" y="305" font-size="12" text-anchor="middle" fill="#4B2A7B">discover · block</text>
  <text x="195" y="322" font-size="12" text-anchor="middle" fill="#4B2A7B">per-tool control</text>

  <path d="M280 268 H340 V200 H398" fill="none" stroke="#7B4FB8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-gov)"/>
  <line x1="280" y1="300" x2="398" y2="300" stroke="#7B4FB8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-gov)"/>

  <rect x="400" y="270" width="240" height="60" rx="12" fill="#F5F5F5" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="520" y="296" font-size="16" font-weight="700" text-anchor="middle" fill="#1B1B1B">LiteLLM</text>
  <text x="520" y="316" font-size="12" text-anchor="middle" fill="#555555">a second gateway, shown in Agent 365</text>

  <line x1="640" y1="300" x2="738" y2="300" stroke="#424242" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="740" y="276" width="220" height="48" rx="10" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.5"/>
  <text x="850" y="297" font-size="14" font-weight="600" text-anchor="middle" fill="#1B1B1B">Microsoft Learn MCP</text>
  <text x="850" y="314" font-size="11" text-anchor="middle" fill="#555555">"MS_Learn_LiteLLM"</text>

  <text x="195" y="360" font-size="12" font-style="italic" text-anchor="middle" fill="#7B4FB8">outside the call path</text>

  <!-- Evidence -->
  <line x1="195" y1="366" x2="195" y2="398" stroke="#7B4FB8" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#arrow-gov)"/>
  <rect x="110" y="400" width="850" height="56" rx="12" fill="#FAFAFA" stroke="#C8C8C8" stroke-width="1.5"/>
  <text x="135" y="433" font-size="15" font-weight="700" fill="#1B1B1B">Evidence</text>
  <text x="215" y="433" font-size="13" fill="#424242">Defender: every admin action · Azure activity log · gateway logs: every request · app telemetry: user and tool</text>

  <!-- Demo steps -->
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF">
    <circle cx="110" cy="125" r="12" fill="#1B1B1B"/><text x="110" y="129">1</text>
    <circle cx="110" cy="255" r="12" fill="#1B1B1B"/><text x="110" y="259">2</text>
    <circle cx="340" cy="234" r="12" fill="#1B1B1B"/><text x="340" y="238">3</text>
    <circle cx="640" cy="270" r="12" fill="#1B1B1B"/><text x="640" y="274">4</text>
    <circle cx="110" cy="400" r="12" fill="#1B1B1B"/><text x="110" y="404">5</text>
  </g>

  <!-- Legend -->
  <line x1="40" y1="500" x2="80" y2="500" stroke="#424242" stroke-width="2"/>
  <text x="90" y="504" font-size="12" fill="#424242">runtime call</text>
  <line x1="200" y1="500" x2="240" y2="500" stroke="#7B4FB8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="250" y="504" font-size="12" fill="#424242">governance</text>
  <circle cx="370" cy="500" r="10" fill="#1B1B1B"/><text x="370" y="504" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
  <text x="388" y="504" font-size="12" fill="#424242">demo step: chat · discover · block · per tool · evidence · Purview</text>
  <line x1="805" y1="500" x2="845" y2="500" stroke="#0B7A75" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="855" y="504" font-size="12" fill="#424242">optional</text>
  </g>
</svg>
